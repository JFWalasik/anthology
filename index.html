<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Anthology</title>
  <meta name="theme-color" content="#FBF8F3">
  <!-- Name and icon used when the app is added to a phone's home screen -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Anthology">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 class="app-name">Anthology</h1>
    <div class="side-toggle" role="group" aria-label="Switch between notes and tasks">
      <button type="button" data-side="notes" aria-pressed="true">Notes</button>
      <button type="button" data-side="tasks" aria-pressed="false">Tasks</button>
    </div>
  </header>

  <section class="access" id="access" hidden>
    <div class="access-box">
      <form id="access-email-form">
        <label for="access-email">Enter your email to get an access code.</label>
        <input type="email" id="access-email" autocomplete="email" placeholder="name@example.com" required>
        <button type="submit" class="primary">Send code</button>
      </form>
      <form id="access-code-form" hidden>
        <label for="access-code" id="access-code-intro"></label>
        <input type="text" id="access-code" inputmode="numeric" autocomplete="one-time-code"
          placeholder="6-digit code" maxlength="10">
        <button type="submit" class="primary">Continue</button>
        <p class="access-links">
          <button type="button" class="link" id="access-resend">Send a new code</button>
          <button type="button" class="link" id="access-change">Use a different email</button>
        </p>
      </form>
      <p class="access-message" id="access-message" role="alert"></p>
    </div>
  </section>

  <div class="layout" id="layout" hidden>
    <aside class="sidebar">
      <div class="sidebar-actions">
        <button type="button" class="primary" id="new-item">New note</button>
        <button type="button" id="new-folder">New folder</button>
      </div>
      <p class="new-item-target" id="new-item-target"></p>
      <nav class="tree-wrap" aria-label="Folders and items">
        <ul class="tree" id="tree"></ul>
      </nav>
      <div class="sidebar-footer">
        <button type="button" class="trash-link" id="trash-link">
          <span>Recently deleted</span>
          <span class="trash-count" id="trash-count"></span>
        </button>
        <p class="sync-status" id="sync-status" aria-live="polite"></p>
        <p class="account">
          <span id="account-email"></span>
          <button type="button" class="link" id="sign-out">Sign out</button>
        </p>
        <button type="button" class="link" id="download-backup">Download backup</button>
        <button type="button" class="link" id="restore-backup">Restore from backup</button>
        <input type="file" id="restore-file" accept=".json,application/json" hidden>
      </div>
    </aside>

    <main class="main">
      <section class="item-pane" id="item-pane" hidden>
        <div class="editor-bar">
          <button type="button" class="quiet back-button" id="back-button">‹ Back</button>
          <span class="item-location">
            <select id="item-folder" aria-label="Folder"></select>
          </span>
          <span class="save-status" id="save-status" aria-live="polite"></span>
          <button type="button" class="quiet danger" id="delete-item">Delete note</button>
        </div>
        <input type="text" class="title-input" id="title-input" aria-label="Title"
          placeholder="Title" autocomplete="off">

        <textarea class="editor" id="editor" aria-label="Note text"
          placeholder="Start writing."></textarea>

        <div class="task-pane" id="task-pane" hidden>
          <ul class="tasks" id="open-tasks"></ul>
          <div class="add-task-row">
            <span class="add-task-mark" aria-hidden="true">+</span>
            <input type="text" class="add-task" id="add-task" aria-label="Add a task"
              placeholder="Add a task" autocomplete="off">
          </div>
          <div class="completed-header" id="completed-header" hidden>
            <span id="completed-count"></span>
            <button type="button" class="link" id="completed-toggle"></button>
          </div>
          <ul class="tasks" id="done-tasks"></ul>
        </div>
      </section>

      <section class="trash-pane" id="trash-pane" hidden>
        <div class="editor-bar">
          <button type="button" class="quiet back-button" id="trash-back">‹ Back</button>
          <span class="item-location"></span>
          <button type="button" class="quiet danger" id="trash-empty">Empty</button>
        </div>
        <div class="trash-body">
          <h2 class="trash-heading">Recently deleted</h2>
          <p class="trash-note">Deleted items can be restored for 30 days. After that they're erased for good.</p>
          <ul class="trash-list" id="trash-list"></ul>
          <p class="trash-none" id="trash-none">Nothing here right now.</p>
        </div>
      </section>

      <section class="empty-state" id="empty-state" hidden>
        <p id="empty-message"></p>
      </section>
    </main>
  </div>

  <div class="menu" id="menu" role="menu" hidden></div>

  <div class="toast" id="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button type="button" class="link" id="toast-undo">Undo</button>
  </div>

  <script src="vendor/supabase-2.117.3.js"></script>
  <script src="config.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
